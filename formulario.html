<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Noticias</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            margin: 40px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #2563eb;
        }

        a {
            text-decoration: none;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Enviar Noticias o Problemas</h1>
    </header>

    <div class="container">
        <form>
            <label>Nombre</label>
            <input type="text" placeholder="Escribe tu nombre">

            <label>Correo</label>
            <input type="email" placeholder="Escribe tu correo">

            <label>Describe la noticia o problema</label>
            <textarea rows="7" placeholder="Escribe aquí"></textarea>

            <button type="submit">Enviar</button>
        </form>

        <br>

        <button>
            <a href="../index.html">Volver al Inicio</a>
        </button>
    </div>

</body>
</html>
