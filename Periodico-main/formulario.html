<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Noticias</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a8a, #60a5fa);
            margin: 0;
            padding: 0;
        }

        header {
           
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
            display:flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
          header img {
          width: 160px;
         height: 120px;
          border-radius: 50%;
          object-fit: cover;
         margin-right: 15px;
         border: 3px solid white;
                        }

        .container {
            width: 90%;
            max-width: 700px;
            background: white;
            margin: 40px auto;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 15px;
            outline: none;
            transition: border 0.3s;
        }

       .btn-enviar {
             background: #1e3a8a;
    color: white;
    border: none;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
    margin-bottom: 10px;
        }
          
         .btn-enviar:hover {
            background: #2563eb;
        }
           .btn-volver {
           background: white;
    color: #1e3a8a;
    border: 2px solid #1e3a8a;
    padding: 12px 25px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    width: 100%;
        }  
           .btn-volver:hover {
            background: #1e3a8a;
            color: inherit;

        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>
<body>

    <header>
       <img src="imagenes/logo.png" alt="Logo">
        <h1>Enviar Noticias o Problemas</h1>
    </header>

    <div class="container">
        <form>
            <label>Nombre</label>
            <input type="text" placeholder="Escribe tu nombre">

            <label>Correo</label>
            <input type="email" placeholder="Escribe tu correo">

            <label>Describe la noticia o problema</label>
            <textarea rows="7" placeholder="Escribe aquí"></textarea>
            </form>
           <button class="btn-enviar" type="submit">Enviar</button>
<a href="index.html"><button class="btn-volver">Volver al Inicio</button></a>

        


</body>
</html>
